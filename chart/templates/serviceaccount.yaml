# A ServiceAccount this Job owns, granting nothing: the seeder calls no
# Kubernetes API. It exists so the pod does not share the namespace's `default`
# account. The token is off here AND on the pod spec, which is the one that
# decides.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Chart.Name }}
  labels:
    app: {{ .Chart.Name }}
automountServiceAccountToken: false
