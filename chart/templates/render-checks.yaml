{{- /*
EVERY RENDER CHECK THIS CHART DECLARES, IN ONE FILE, AND THE FILE RENDERS
NOTHING. Each refusal names the values key and the reason (ADR-0606: each one is
proved by a test carrying its poison input, `scripts/tests/test_render.py`).

THE DECLARATION RULES MIRROR THE STORE'S (`project-db` v0.7.0,
`src/write/sync.rs` and `src/path.rs`), which stays the authority, and the
binary checks the same rules again (`src/registry.rs`). They run here so a bad
declaration fails the Argo sync at render, before a Job exists.

`registry` IS REQUIRED (ADR-0857 contract step). An absent or null block is
refused before any check below runs: by the schema, or by the `required` in
`seeder.registry` (`_registry.tpl`), included first below.
*/}}
{{- $_ := include "seeder.registry" . }}
{{- $r := .Values.registry }}
{{- if not (kindIs "map" $r) }}
{{- fail "registry must be a map with `roots`, `projects` and `allowMassArchive` (plans/the-d35-seeder.md, \"The declaration\")" }}
{{- end }}

{{- /* ADR-0939: the mass-archive flag comes ONLY from an explicit value. No default. */}}
{{- if not (and (hasKey $r "allowMassArchive") (kindIs "bool" $r.allowMassArchive)) }}
{{- fail "registry.allowMassArchive must be set to true or false. It has no default (ADR-0939): false keeps the store's mass-archive guard on, and true lets ONE sync archive more than half of the active org projects" }}
{{- end }}

{{- range $list := list "roots" "projects" }}
{{- if not (and (hasKey $r $list) (kindIs "slice" (get $r $list))) }}
{{- fail (printf "registry.%s must be a list (it may be empty only for projects)" $list) }}
{{- end }}
{{- end }}
{{- if not $r.roots }}
{{- fail "registry.roots must name at least one root: the namespace anchors every project sits under (ADR-0673)" }}
{{- end }}

{{- $segment := "^[A-Za-z0-9._-]+$" }}
{{- $roots := dict }}
{{- $seen := dict }}
{{- range $list := list "roots" "projects" }}
{{- range $i, $e := get $r $list }}
{{- $key := printf "registry.%s[%d]" $list $i }}
{{- if not (kindIs "map" $e) }}
{{- fail (printf "%s must be a map with path, sourceRepo and optionally displayName" $key) }}
{{- end }}
{{- if not (and (hasKey $e "path") (kindIs "string" $e.path) $e.path) }}
{{- fail (printf "%s.path must be a non-empty string" $key) }}
{{- end }}
{{- $path := $e.path }}
{{- if gt (len $path) 255 }}
{{- fail (printf "%s.path %q is %d characters and the store's limit is 255" $key $path (len $path)) }}
{{- end }}
{{- range (splitList "/" $path) }}
{{- if or (not (regexMatch $segment .)) (eq . ".") (eq . "..") }}
{{- fail (printf "%s.path %q contains the segment %q. A segment is one or more of A-Z a-z 0-9 . _ - and is neither \".\" nor \"..\"; a leading, trailing or doubled slash is an empty segment" $key $path .) }}
{{- end }}
{{- end }}
{{- $folded := lower $path }}
{{- $first := first (splitList "/" $folded) }}
{{- if eq $first "local" }}
{{- fail (printf "%s.path %q is under the reserved segment \"local\". A sync declares organisation projects only; personal projects are registered by their own account (ledger 641)" $key $path) }}
{{- end }}
{{- if eq $list "roots" }}
{{- if contains "/" $path }}
{{- fail (printf "%s.path %q has more than one segment. A root is a namespace anchor, a single segment such as \"acme\" (ADR-0673); declare a deeper path as a project under one" $key $path) }}
{{- end }}
{{- $_ := set $roots $folded true }}
{{- else }}
{{- if or (not (contains "/" $path)) (not (hasKey $roots $first)) }}
{{- fail (printf "%s.path %q is not under a declared root. Every project sits strictly beneath one of registry.roots" $key $path) }}
{{- end }}
{{- end }}
{{- if hasKey $seen $folded }}
{{- fail (printf "%s.path %q is declared twice (paths are compared with ASCII case folded, as the store compares them)" $key $path) }}
{{- end }}
{{- $_ := set $seen $folded true }}
{{- /*
WIDTHS IN CHARACTERS, NOT BYTES: the store counts `chars()` (`MAX_CHARS`) and so
does the binary. sprig's `len` on a string is bytes, so a 200-character
multibyte name would be refused at 400. `splitList ""` splits into characters.
The path keeps `len`: the store measures it in bytes, and its grammar is ASCII.
*/}}
{{- if not (and (hasKey $e "sourceRepo") (kindIs "string" $e.sourceRepo) $e.sourceRepo) }}
{{- fail (printf "%s.sourceRepo is empty for %q. Every declared row is org class, and an org row names the repository whose pull request flow governs it" $key $path) }}
{{- end }}
{{- if gt (len (splitList "" $e.sourceRepo)) 255 }}
{{- fail (printf "%s.sourceRepo of %q is longer than the store's 255" $key $path) }}
{{- end }}
{{- if hasKey $e "displayName" }}
{{- if not (kindIs "string" $e.displayName) }}
{{- fail (printf "%s.displayName of %q must be a string" $key $path) }}
{{- end }}
{{- if gt (len (splitList "" $e.displayName)) 255 }}
{{- fail (printf "%s.displayName of %q is longer than the store's 255" $key $path) }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}

{{- /*
TEAM ACCESS (plans/team-access.md §2). Cross-key rules, each naming the key. The
one rule that is NOT here is "`teams` non-empty means a team named
`administrators` with at least one member": that constrains the shape of the one
key `teams` and lives in `values.schema.json` as a draft-07 `if`/`then` +
`contains`, a named exception in its `$comment`. This file therefore checks the
`administrators` root grants only when `administrators` is declared, and checks
no member COUNT. The seeder binary checks both again (`src/registry/teams.rs`).

THE TRANSITION RULE: with `teams` absent or empty no `grants` key may appear on
any row, and nothing below it runs. `seeder.hasTeams` is "true" only for a
non-empty list.
*/}}
{{- if and (hasKey $r "teams") $r.teams (not (kindIs "slice" $r.teams)) }}
{{- fail "registry.teams must be a list of {name, members} maps. It may be absent or empty (then no `grants` key may appear anywhere and the seeder makes no SyncTeams call)" }}
{{- end }}
{{- $hasTeams := eq (include "seeder.hasTeams" .) "true" }}
{{- if not $hasTeams }}
{{- range $list := list "roots" "projects" }}
{{- range $i, $e := get $r $list }}
{{- if $e.grants }}
{{- fail (printf "registry.%s[%d].grants is set on %q while registry.teams is absent or empty. A grant names a declared team: declare registry.teams, or remove every `grants` key (the transition rule, plans/team-access.md §2)" $list $i $e.path) }}
{{- end }}
{{- end }}
{{- end }}
{{- else }}
{{- if not (and (hasKey $r "allowMassRevoke") (kindIs "bool" $r.allowMassRevoke)) }}
{{- fail "registry.allowMassRevoke must be set to true or false once registry.teams is declared. It has no default (ADR-0963 (6)): false keeps the store's mass-revoke guard on, and true lets ONE sync delete more than half of the stored grants" }}
{{- end }}
{{- if not (($.Values.iam | default dict).tls | default dict).caSecret }}
{{- fail "iam.tls.caSecret must name the Secret holding the authority that signed iam's serving certificate (the estate's is `iam-tls`) once registry.teams is declared. It has no default (ADR-0854): the seeder dials iam for SyncTeams, and presents the same client leaf as to project" }}
{{- end }}
{{- $names := dict }}
{{- range $i, $t := $r.teams }}
{{- $key := printf "registry.teams[%d]" $i }}
{{- if not (kindIs "map" $t) }}
{{- fail (printf "%s must be a map with name and members" $key) }}
{{- end }}
{{- if not (and (kindIs "string" $t.name) (regexMatch "^[a-z][a-z0-9-]{0,62}$" $t.name)) }}
{{- fail (printf "%s.name %q is not a team name. A name matches ^[a-z][a-z0-9-]{0,62}$" $key (toString $t.name)) }}
{{- end }}
{{- if hasKey $names $t.name }}
{{- fail (printf "%s.name %q is declared twice. Names are unique; a rename is an archive plus a new team" $key $t.name) }}
{{- end }}
{{- $_ := set $names $t.name true }}
{{- /* A members list that is absent or empty is the schema's to refuse for `administrators`; any other team may be empty. */}}
{{- if and (hasKey $t "members") $t.members (not (kindIs "slice" $t.members)) }}
{{- fail (printf "%s.members must be a list of uuids" $key) }}
{{- end }}
{{- $seenMembers := dict }}
{{- range $j, $m := $t.members }}
{{- if not (and (kindIs "string" $m) (regexMatch "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$" $m)) }}
{{- fail (printf "%s.members[%d] %q is not a lowercase canonical uuidv7: 36 characters, 8-4-4-4-12 lowercase hex, version 7, variant 8, 9, a or b. Declare the bare uuid `GET /auth/whoami` answers as account_segment" $key $j (toString $m)) }}
{{- end }}
{{- if hasKey $seenMembers $m }}
{{- fail (printf "%s.members[%d] %q is listed more than once" $key $j $m) }}
{{- end }}
{{- $_ := set $seenMembers $m true }}
{{- end }}
{{- end }}
{{- range $list := list "roots" "projects" }}
{{- range $i, $e := get $r $list }}
{{- $row := printf "registry.%s[%d]" $list $i }}
{{- $seenTeams := dict }}
{{- if and (hasKey $e "grants") $e.grants (not (kindIs "slice" $e.grants)) }}
{{- fail (printf "%s.grants must be a list of {team, level} maps" $row) }}
{{- end }}
{{- range $k, $g := $e.grants }}
{{- $key := printf "%s.grants[%d]" $row $k }}
{{- if not (kindIs "map" $g) }}
{{- fail (printf "%s must be a map with team and level" $key) }}
{{- end }}
{{- if not (and (kindIs "string" $g.team) (hasKey $names $g.team)) }}
{{- fail (printf "%s.team %q on %q names a team that registry.teams does not declare" $key (toString $g.team) $e.path) }}
{{- end }}
{{- if not (has $g.level (list "read" "readWrite")) }}
{{- fail (printf "%s.level %q on %q must be read or readWrite" $key (toString $g.level) $e.path) }}
{{- end }}
{{- if hasKey $seenTeams $g.team }}
{{- fail (printf "%s.team %q on %q is named more than once. One team appears at most once per row" $key $g.team $e.path) }}
{{- end }}
{{- $_ := set $seenTeams $g.team true }}
{{- end }}
{{- end }}
{{- end }}
{{- /* ADR-0962 ruling 5, made mechanical: every root grants `administrators` readWrite. Only when `administrators` is declared; its absence is the schema's refusal. */}}
{{- if hasKey $names "administrators" }}
{{- range $i, $root := $r.roots }}
{{- $held := false }}
{{- range $root.grants }}
{{- if and (eq .team "administrators") (eq .level "readWrite") }}
{{- $held = true }}
{{- end }}
{{- end }}
{{- if not $held }}
{{- fail (printf "registry.roots[%d] %q carries no readWrite grant for the team \"administrators\". With registry.teams declared every root grants it (ADR-0962 ruling 5): add {team: administrators, level: readWrite} to registry.roots[%d].grants" $i $root.path $i) }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}

{{- /*
THE SIZE GUARD (ADR-0705), below the 1 MiB a ConfigMap holds. The binary
refuses at the same number (`src/registry.rs`, `MAX_BYTES`); `tests/chart.rs`
pins the two equal.
*/}}
{{- $bytes := len (include "seeder.registryJson" .) }}
{{- if gt $bytes 786432 }}
{{- fail (printf "registry renders to %d bytes and the guard is 786432, below the 1 MiB a ConfigMap holds (ADR-0705)" $bytes) }}
{{- end }}

{{- /*
THE TRANSPORT (ADR-0854). Both Secrets are required with no chart default:
`project` admits SyncProjects only from the seeder's own verified leaf, so there
is no cleartext and no identity-less configuration that could work.
*/}}
{{- $tls := .Values.project.tls | default dict }}
{{- if not $tls.caSecret }}
{{- fail "project.tls.caSecret must name the Secret holding the authority that signed project's serving certificate (the estate's is `project-tls`). It has no default (ADR-0854)" }}
{{- end }}
{{- if not $tls.clientCertSecret }}
{{- fail "project.tls.clientCertSecret must name the Secret holding the seeder's client leaf, `seeder-client-tls`, which platform issues with common name `seeder-caller`. It has no default (ADR-0854): project refuses every other leaf" }}
{{- end }}

{{- /*
THE JOB'S DEADLINE MUST OUTLAST THE RETRY LOOPS, or Kubernetes kills a run that
was still allowed to wait. One loop's worst case is every attempt timing out:
attempts x (requestTimeoutSeconds + backoffSeconds). A run that declares teams
makes TWO calls in sequence, SyncTeams to iam and then SyncProjects to project,
each with its own loop, so the bound is their sum; without teams it is
project's alone.
*/}}
{{- $loop := mul (int .Values.sync.attempts) (add (int .Values.project.requestTimeoutSeconds) (int .Values.sync.backoffSeconds)) }}
{{- if $hasTeams }}
{{- $loop = add $loop (mul (int .Values.sync.attempts) (add (int .Values.iam.requestTimeoutSeconds) (int .Values.sync.backoffSeconds))) }}
{{- end }}
{{- if lt (int .Values.job.activeDeadlineSeconds) (int $loop) }}
{{- fail (printf "job.activeDeadlineSeconds (%d) is shorter than the retry loop's worst case, sync.attempts x (project.requestTimeoutSeconds + sync.backoffSeconds), plus the same for iam.requestTimeoutSeconds when registry.teams is declared = %d. Raise the deadline or shorten the loop" (int .Values.job.activeDeadlineSeconds) (int $loop)) }}
{{- end }}
